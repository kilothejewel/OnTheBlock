# Areas in Stellenbosch: neighbourhoods a Plan can stay inside (GLOSSARY: Area).
# Loaded by app/services/areas.py; served at GET /api/v1/cities/stellenbosch/areas.
#
# centre        from OpenStreetMap (Nominatim), 16 Nov 2026
# radius_m      roughly how far the Area reaches from its centre
# walk_friendly fine to walk between nearby Stops by day; feeds transport legs (#97)
# night_safe    fine to walk between Stops after dark; feeds the validator (#99).
#               false whenever we're not sure: a night leg is e-hailing then.
# reviewed      true once a local (Cameron, for Cape Town) has checked the Area
# aliases       other names people use for it in chat
#
# DRAFT: written from public knowledge, not yet checked by a local.

areas:
  - slug: stellenbosch-central
    name: "Stellenbosch town centre"
    centre: {lat: -33.931, lng: 18.8587}
    radius_m: 1000
    walk_friendly: true
    night_safe: false
    aliases: ["Dorp Street", "Church Street", "the Braak"]
    notes: "Oak-lined historic streets, galleries and cafes; very walkable by day."
    reviewed: false
  - slug: jonkershoek
    name: "Jonkershoek"
    centre: {lat: -33.9702, lng: 18.9471}
    radius_m: 3000
    walk_friendly: false
    night_safe: false
    aliases: ["Jonkershoek Nature Reserve"]
    notes: "Mountain trails and waterfalls; outdoor only, start early."
    reviewed: false
  - slug: franschhoek
    name: "Franschhoek"
    centre: {lat: -33.9092, lng: 19.1194}
    radius_m: 2000
    walk_friendly: true
    night_safe: false
    aliases: ["Franschhoek Wine Tram"]
    notes: "Wine valley village with the Wine Tram; about 30 minutes' drive."
    reviewed: false
  - slug: banhoek
    name: "Banhoek Valley and Pniel"
    centre: {lat: -33.8936, lng: 18.9594}
    radius_m: 2500
    walk_friendly: false
    night_safe: false
    aliases: ["Banhoek", "Pniel", "Helshoogte Pass"]
    notes: "Wine estates over the Helshoogte Pass; you need a car or a tour."
    reviewed: false
