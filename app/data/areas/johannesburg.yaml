    name: "Maboneng"
    centre: {lat: -26.2036, lng: 28.06}
    radius_m: 600
    walk_friendly: true
    night_safe: false
    aliases: ["Maboneng Precinct", "Arts on Main"]
    notes: "Arts precinct with galleries and Sunday markets; e-hail in and out."
    reviewed: false
