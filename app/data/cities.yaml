  - slug: stellenbosch
    name: Stellenbosch
    province: Western Cape
    country_code: ZA
    currency: ZAR
    timezone: Africa/Johannesburg
    centre: {lat: -33.9321, lng: 18.8602}
    search_radius_m: 10000
    # Stellenbosch Local Municipality (town and winelands).
    bounds: {sw: {lat: -34.0634, lng: 18.7083}, ne: {lat: -33.7934, lng: 19.2438}}
    launch_status: beta
    areas_file: areas/stellenbosch.yaml
