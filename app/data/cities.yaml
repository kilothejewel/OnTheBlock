    timezone: Africa/Johannesburg
    centre: {lat: -25.7479, lng: 28.2293}
    search_radius_m: 25000
    # City of Tshwane Metropolitan Municipality.
    bounds: {sw: {lat: -26.0781, lng: 27.8904}, ne: {lat: -25.1096, lng: 29.0984}}
    launch_status: beta
    areas_file: areas/pretoria.yaml
    aliases: [Tshwane, PTA]
