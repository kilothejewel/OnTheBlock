    # eThekwini Metropolitan Municipality.
    bounds: {sw: {lat: -30.2686, lng: 30.5600}, ne: {lat: -29.5011, lng: 31.1858}}
    launch_status: beta
    areas_file: areas/durban.yaml
    aliases: [eThekwini, Durbs]
    usd_rate: 18

  - slug: pretoria
    name: Pretoria
    province: Gauteng
    country_code: ZA
