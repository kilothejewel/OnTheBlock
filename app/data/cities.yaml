# Cities the app plans in, loaded and validated at startup (app/core/cities.py).
#
# bounds: the city's real metro extent as south-west and north-east corners.
#   Text Search is restricted to it, results outside it are dropped, and the
#   places catalogue ingest (#119) clips to it. Taken from OpenStreetMap's
#   administrative boundaries (Nominatim, 16 Nov 2026); see each note.
# centre / search_radius_m: where search results are centred.
# launch_status: live (planned for everyone), beta (planned, marked beta),
#   hidden (no new Plans or searches; saved Plans still open).
# areas_file: the city's Areas (#35), relative to app/data. May not exist yet.
# usd_rate: rough units per US dollar, only for Demo data cost estimates.
# aliases: other names the city search box matches (#89), e.g. Jozi.
#
# Order matters within each group: the picker lists South African cities
# first (live, then beta), then international ones.

cities:
  - slug: cape-town
    name: Cape Town
    province: Western Cape
    country_code: ZA
    currency: ZAR
    timezone: Africa/Johannesburg
    centre: {lat: -33.9249, lng: 18.4241}
    search_radius_m: 20000
    # City of Cape Town, mainland only: OSM's box also takes in the Prince Edward Islands.
    bounds: {sw: {lat: -34.36, lng: 18.30}, ne: {lat: -33.47, lng: 19.00}}
    launch_status: beta
    areas_file: areas/cape-town.yaml
    aliases: [Mother City, Kaapstad, CPT]
    usd_rate: 18

  - slug: johannesburg
    name: Johannesburg
    province: Gauteng
    country_code: ZA
    currency: ZAR
    timezone: Africa/Johannesburg
    centre: {lat: -26.2041, lng: 28.0473}
    search_radius_m: 25000
    # City of Johannesburg Metropolitan Municipality.
    bounds: {sw: {lat: -26.5263, lng: 27.7143}, ne: {lat: -25.9028, lng: 28.2145}}
    launch_status: beta
    areas_file: areas/johannesburg.yaml
    aliases: [Joburg, Jozi, Jhb, Egoli]
    usd_rate: 18

  - slug: durban
    name: Durban
