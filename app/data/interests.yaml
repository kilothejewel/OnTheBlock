# Interests: what people say they want, mapped to the categories each
# data source uses. Loaded by app/services/interests.py.
#
# synonyms          whole words or phrases matched in a chat message (match_interests)
# included_types    Google Places API (New) Table A types: Google ID matching (#120) and the live check
# text_queries      Text Search queries for this Interest
# overture_categories  Overture Maps places taxonomy `primary` values: the catalogue (#119)
# fsq_category_ids  Foursquare OS Places category ids (name in the comment): the catalogue (#119)
# description       one sentence; its embedding is the Interest's query vector (#123)
# time_of_day       morning (to 12:00), afternoon (12:00-17:00), evening (17:00-21:30), late_night (from 21:30)
# outdoor           needs daylight and dry weather: never after sunset minus 60 minutes
# typical_minutes   how long a visit usually takes
# slot_kinds        which Slots of the skeleton (#92) it can fill
# min_reviews       (optional) fewest reviews a candidate needs; default in scoring (#94)
#
# Every type, category and id is checked against the lists in app/data/taxonomy/
# (see that folder's README for their sources and versions) by tests/test_interests.py.

