# Monthly dependency-update pull requests, grouped so each ecosystem opens one
# PR at a time. CI runs on each, so an update only merges if everything passes.
version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: monthly
    groups:
      python:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: monthly
    groups:
      web:
        patterns: ["*"]
    ignore:
      # openapi-typescript 7 (npm run gen:api) needs TypeScript 5; lift this
      # once it accepts a newer major.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
